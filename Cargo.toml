[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/clipboard-core",
  "crates/clipboard-store",
  "crates/clipboard-search",
  "crates/clipboard-images",
  "crates/clipboard-import",
  "crates/clipboard-keyvault",
  "crates/clipboard-launcher",
  "crates/clipboard-link-preview",
  "crates/platform-macos",
  "crates/platform-linux",
  "crates/platform-windows",
  "crates/clipboard-zstd-bound",
  "tools/clipboard-bench",
  "tools/clipboard-import-cli",
]

[workspace.package]
version = "0.4.11"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aes = "=0.8.4"
anyhow = "1.0"
allocation-counter = "=0.8.1"
# Pinned exactly like the other cipher crates: envelope decryption is
# contractual against the keyvault server's Web Crypto sealing.
aes-gcm = "=0.10.3"
base64 = "0.23.1"
bitflags = { version = "2.13.1", features = ["serde"] }
blake3 = "1.8.7"
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
# Pinned exactly: block-cipher and padding behaviour is contractual here, the
# same reason cap-std, csv-core and zstd are pinned. cbc 0.2 exists only as a
# release candidate, so the stable 0.1 line is what ships.
cbc = { version = "=0.1.2", features = ["block-padding"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
csv-core = "=0.1.13"
directories = "6.0.0"
# Titles live in whatever encoding an old CMS wrote, not in UTF-8: Polish pages
# still ship windows-1250 and ISO-8859-2, and decoding those as UTF-8 turns
# every diacritic into a replacement character.
encoding_rs = "0.8.35"
# rust_backend keeps this pure Rust (miniz_oxide); no libz-sys, no C toolchain.
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
# `tiff` is declared here even though arboard already turns it on transitively
# on macOS: application icons arrive as NSImage TIFF, and relying on another
# crate's feature set for a decoder this side calls directly is a dependency
# that can silently break the moment that crate changes its mind.
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg", "webp", "tiff"] }
# Bundle metadata lives in `Contents/Info.plist`, which macOS ships as XML or
# as a binary plist depending on where the bundle sits — the reader has to take
# both without asking. Already present transitively, so this pins the version
# the shell already builds with rather than adding a new tree to the lockfile.
plist = "1.10.0"
# HTTPS through the system trust store: on macOS that is Security.framework,
# so a corporate root or a user-added certificate behaves here exactly as it
# does everywhere else on the machine. The alternative bundles its own crypto
# and its own certificate list, which is more to trust and more to update.
# Rasterises an SVG that a page nominates as its own picture. Text rendering
# is on because a logo without its words is a broken logo; the font database it
# needs is loaded once, on first use, never at startup.
resvg = "=0.46.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls", "charset"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "cache"] }
rusqlite_migration = "2.6.0"
# RSA-OAEP unwrap of the keyvault agent envelope; pinned for the same
# contractual reason as the symmetric crates above. getrandom gives the
# blinding RNG the decrypt path needs.
rsa = { version = "=0.9.8", features = ["getrandom"] }
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
zeroize = "=1.9.0"
zstd = "=0.13.3"
zstd-sys = { version = "=2.0.16", default-features = false }
