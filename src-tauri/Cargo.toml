[package]
name = "trove-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
trove-core = { path = "../crates/trove-core" }
trove-store = { path = "../crates/trove-store" }
trove-search = { path = "../crates/trove-search" }
trove-images = { path = "../crates/trove-images" }
trove-import = { path = "../crates/trove-import" }
trove-keyvault = { path = "../crates/trove-keyvault" }
trove-launcher = { path = "../crates/trove-launcher" }
trove-link-preview = { path = "../crates/trove-link-preview" }
reqwest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../crates/platform-macos" }
base64.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
aes-gcm.workspace = true
base64.workspace = true
image.workspace = true
# Reads `Info.plist` so a test can assert the application stays out of the Dock.
plist.workspace = true
rsa.workspace = true
sha2.workspace = true
tempfile.workspace = true
tauri = { version = "2.11.5", features = ["test"] }
