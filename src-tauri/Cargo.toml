[package]
name = "clipboard-history-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
clipboard-core = { path = "../crates/clipboard-core" }
clipboard-store = { path = "../crates/clipboard-store" }
clipboard-search = { path = "../crates/clipboard-search" }
clipboard-import = { path = "../crates/clipboard-import" }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../crates/platform-macos" }
base64.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true
tauri = { version = "2.11.5", features = ["test"] }
