# Cuts a release from a tag: build, sign, notarise, staple, publish.
#
# This existed as a page of notes and a person following them, which is how
# 0.4.11 lost two hours to a disk image left attached by a cancelled upload.
# Every step below is one of those notes, in the order that works.
#
# The commit a tag points at is expected to be green: CI runs the gates on
# every push to main, and tags are cut from main. This workflow therefore
# builds rather than re-tests, and fails loudly if signing or notarisation
# does not hold.
#
# Required repository secrets:
#   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password that .p12 was exported with
#   APPLE_SIGNING_IDENTITY      SHA-1 fingerprint of that certificate, not its
#                               name: two of them share a name on this account
#   APPLE_API_KEY               base64 of the App Store Connect .p8
#   APPLE_API_KEY_ID            the key id
#   APPLE_API_ISSUER            the issuer id
#   TAURI_SIGNING_PRIVATE_KEY   the updater's minisign private key, the whole
#                               file `tauri signer generate` wrote. Its public
#                               half is compiled into every copy of the app, so
#                               losing this key strands them all on the version
#                               they have.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password that key was made with
name: Release

on:
  push:
    tags: ["v*"]
  # So a failed publish can be retried without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.4.12"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Through env, never interpolated into the script body. A workflow_dispatch
      # input is attacker-controllable text, and this job holds the signing
      # certificate and the notarisation key — `v1$(...)` in the tag box would
      # otherwise run as code with both in reach. Validating here also settles
      # it for every later step, which all read these outputs.
      - name: Read the version from the tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing a tag that is not vMAJOR.MINOR.PATCH: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag and the manifests have to agree. They are bumped by hand, and a
      # release built from a mismatch would ship a version nobody can trace.
      - name: Check the tag matches the manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in Cargo.toml src-tauri/tauri.conf.json apps/desktop-ui/package.json; do
            grep -q "\"\?version\"\? *[:=] *\"$VERSION\"" "$f" \
              || { echo "::error::$f does not declare version $VERSION"; exit 1; }
          done

      # A build carrying the placeholder would check for updates and refuse
      # every one it found, and the only way out of that is a manual install.
      - name: Check the updater key is the real one
        run: |
          if grep -q "REPLACE_WITH_TROVE_UPDATER_PUBLIC_KEY" src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json still has the placeholder updater public key"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A keychain of our own, deleted at the end. The runner's login keychain
      # is shared with everything else on the box and outlives the job.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign stops for a UI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build
        run: pnpm tauri build

      # Signing after the build, never before: tauri regenerates the bundle and
      # would undo it, and its own bundle fails `codesign --deep --strict` with
      # "code has no resources but signature indicates they must be present".
      #
      # APPLE_SIGNING_IDENTITY is the certificate's SHA-1 fingerprint, not its
      # name. Two Developer ID certificates on this account share a name, and
      # signing by name fails as ambiguous — in a way that leaves the previous
      # signature in place rather than failing loudly.
      - name: Sign the application
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="target/release/bundle/macos/Trove.app"
          codesign --force --deep --timestamp --options runtime \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"
          # The exit code is not enough: a failed sign can leave the previous
          # signature in place, so the identity itself is what gets checked.
          codesign -dvv "$APP" 2>&1 | grep -q "TeamIdentifier=" \
            || { echo "::error::the bundle is not signed with a Developer ID"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Write the notarisation key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      # The application is notarised as a zip rather than inside the image.
      # notarytool mounts a .dmg to inspect it before uploading, and a mount
      # left behind by an interrupted run deadlocks every attempt after it —
      # sleeping at zero CPU with no connection, printing nothing, never
      # registering a submission. A zip has nothing to mount.
      - name: Notarise and staple the application
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP="target/release/bundle/macos/Trove.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Trove.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Trove.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"

      # Built by hand from a staged copy. Tauri's own dmg step drives Finder to
      # style the volume and cannot unmount it when anything else holds a disk
      # image, and it would regenerate the .app and undo the signature above.
      #
      # From the stapled application, so the copy someone drags to /Applications
      # carries its ticket and opens without an online Gatekeeper check.
      - name: Build the disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG="$RUNNER_TEMP/Trove_${VERSION}_aarch64.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto "target/release/bundle/macos/Trove.app" "$STAGE/Trove.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Trove" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=Trove_${VERSION}_aarch64.dmg" >> "$GITHUB_OUTPUT"

      - name: Sign, notarise and staple the disk image
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          # --timeout so a stalled upload ends by itself rather than burning the
          # job's whole budget with nothing to show for it.
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

      # The one check that speaks for the person downloading this: both the
      # image and the application inside it must come back as notarised.
      - name: Verify Gatekeeper accepts both
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          spctl -a -vv "target/release/bundle/macos/Trove.app"

      # What an installed copy downloads to update itself. Packed from the
      # stapled application — not by `tauri build`, whose archive would predate
      # the signature above — so the bundle that replaces the old one passes
      # Gatekeeper as it stands.
      #
      # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble `._` files,
      # which would land inside the bundle and break its sealed resources.
      - name: Build the updater archive
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARCHIVE="$RUNNER_TEMP/Trove.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C target/release/bundle/macos Trove.app
          tar -tzf "$ARCHIVE" | grep -q "^Trove.app/Contents/MacOS/" \
            || { echo "::error::the updater archive does not hold the application"; exit 1; }
          if tar -tzf "$ARCHIVE" | grep -q "/\._"; then
            echo "::error::the updater archive carries AppleDouble files"; exit 1
          fi
          pnpm tauri signer sign "$ARCHIVE"
          test -s "$ARCHIVE.sig" \
            || { echo "::error::signing the updater archive produced no signature"; exit 1; }
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            # A draft until the updater files are on it: published now, it would
            # be `releases/latest` without a `latest.json`, and every check made
            # in that minute would report the server as unreachable.
            gh release create "$TAG" "$DMG" --title "$TAG" --generate-notes --draft
          fi

      # The notes are the ones --generate-notes just wrote for the release.
      - name: Write the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.updater.outputs.archive }}
        run: |
          NOTES="$(gh release view "$TAG" --json body --jq .body)"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$ARCHIVE.sig")" \
            --arg url "https://github.com/jash90/trove/releases/download/$TAG/Trove.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      # Last, because this is the step that makes the release reach people:
      # installed copies read `releases/latest/download/latest.json` here, and
      # a release without it is one they cannot see.
      - name: Publish the updater files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.updater.outputs.archive }}
        run: |
          gh release upload "$TAG" --clobber \
            "$ARCHIVE" "$ARCHIVE.sig" "$RUNNER_TEMP/latest.json"
          gh release edit "$TAG" --draft=false --latest

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$KEYCHAIN" || true
