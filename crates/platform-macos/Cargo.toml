[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipboard-core = { path = "../clipboard-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSData"] }
