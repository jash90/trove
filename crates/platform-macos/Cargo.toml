[package]
name = "platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trove-core = { path = "../trove-core" }
# The system's own shortcut table is a preference domain, and reading it means
# parsing a plist. Declared outside the macOS block on purpose: the half of
# `symbolic_hotkeys` that decides anything is pure, and its tests have to run on
# every host the workspace is checked on, not only on the one that has the file.
plist.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSPasteboard",
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    # `CGImageForProposedRect:context:hints:` and `initWithCGImage:` — the
    # rasterisation an icon-services image can actually answer — live behind
    # these two.
    "NSGraphicsContext",
    "objc2-core-graphics",
    # `runningApplicationWithProcessIdentifier:` takes a `pid_t`, which the
    # bindings only expose once libc is in the build.
    "libc",
    # The alert a launch that cannot start shows: `runModal` is gated on
    # `NSApplication`, and `addButtonWithTitle:` returns an `NSButton`, which
    # drags in the view hierarchy it belongs to.
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
] }
# `NSValue` is where `NSNumber` lives, and `NSObject` is what `NSDictionary::from_slices`
# is gated on — both are needed to hand the Accessibility check its options dictionary.
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSValue", "NSObject"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry"] }
# `CGGeometry` is what re-exports `CGPoint`/`CGSize` from Core Foundation —
# the value types the Accessibility API's position and size attributes use.

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
